<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Denisse's Portfolio — Pick a Drink</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Bagel+Fat+One&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Montserrat:wght@400..800&amp;family=Pinyon+Script&amp;display=swap">
<style>
body{margin:0;background:#3E000D;font-family:'Montserrat',system-ui,sans-serif;color:#F8F1E7}
a{color:#F8F1E7}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #F8F1E7;outline-offset:4px}
@keyframes dropIn{from{opacity:0;transform:translateY(-70px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes glow{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}50%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.drop{animation:dropIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.fade-up{animation:fadeUp .55s ease both}
.bob{animation:bob 1.4s ease-in-out infinite}
.float{animation:float 7s ease-in-out infinite}
.vogue{font-family:'Bodoni Moda',Didot,serif}
.script{font-family:'Pinyon Script',cursive;font-weight:400}
.choed{font-family:'Abril Fatface',Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
.retro{font-family:'Bagel Fat One',cursive}
.slot{position:absolute;left:50%;top:50%;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:#F8F1E7;will-change:transform,opacity}
.track{height:auto}
.slot{position:absolute;left:50%;top:50%;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;color:#F8F1E7;will-change:transform,opacity;cursor:pointer}
.slot img{width:auto;object-fit:contain;display:block;filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));pointer-events:none;transition:transform .45s cubic-bezier(.3,1.6,.5,1),filter .35s ease}
.cup{display:block}
.slot.is-center .cup{animation:float 6s ease-in-out infinite}
.slot:hover img,.slot:focus-visible img{transform:translateY(-22px) scale(1.1);filter:drop-shadow(0 0 22px rgba(248,241,231,.85)) drop-shadow(0 0 60px rgba(248,241,231,.45)) drop-shadow(0 30px 30px rgba(0,0,0,.45))}
.slot:focus-visible{outline:none}
.side-arrow{position:absolute;top:50%;margin-top:-26px;z-index:20}

.machine{position:relative;width:100%;overflow:hidden;border-radius:28px;background:#3E000D;border:2px solid rgba(248,241,231,.55);box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 24px 50px rgba(0,0,0,.4)}
.reel-item{display:flex;align-items:center;justify-content:center;width:100%;background:none;border:none;padding:0;cursor:pointer}
.reel-item img{width:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.lever{position:absolute;right:-74px;top:18%;width:52px;display:flex;flex-direction:column;align-items:center;background:none;border:none;color:#F8F1E7;padding:0}
.lever-knob{width:30px;height:30px;border-radius:50%;background:#F8F1E7;box-shadow:0 6px 12px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.lever-arm{width:6px;height:110px;border-radius:3px;background:linear-gradient(#F8F1E7,rgba(248,241,231,.35));transform-origin:bottom center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.lever:hover .lever-knob{transform:translateY(40px)}
.lever:hover .lever-arm{transform:scaleY(.62)}
.lever:active .lever-knob{transform:translateY(70px)}
.slot img{height:280px;width:auto;filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));pointer-events:none}
.slot.is-center img{animation:float 6s ease-in-out infinite}
.slot:hover{filter:brightness(1.08)}
.arrow-btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(248,241,231,.45);background:rgba(62,0,13,.55);color:#F8F1E7;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;backdrop-filter:blur(8px)}
.arrow-btn:hover{background:#F8F1E7;color:#3E000D;transform:scale(1.06)}
.chip-q{background:transparent;border:1px solid rgba(248,241,231,.3);color:#F8F1E7;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;min-height:36px;transition:background .2s,color .2s,transform .2s}
.chip-q:hover{background:rgba(248,241,231,.12);transform:translateY(-1px)}
.glance{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-left:2px solid rgba(248,241,231,.18);color:#F8F1E7;padding:10px 14px;font-size:13px;font-weight:600;min-height:44px;box-sizing:border-box;transition:border-color .25s,background .25s,padding .25s}
.glance:hover{background:rgba(248,241,231,.07)}
.go-btn{display:inline-flex;align-items:center;gap:12px;background:#F8F1E7;color:#3E000D;text-decoration:none;border-radius:999px;padding:16px 26px;font-size:13px;font-weight:800;letter-spacing:.1em;min-height:52px;box-sizing:border-box;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.go-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.35);color:#3E000D}
.go-btn .go-arrow{transition:transform .3s}
.go-btn:hover .go-arrow{transform:translateX(5px)}
.ghost{background:transparent;border:1px solid rgba(248,241,231,.45);color:#F8F1E7;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:600;letter-spacing:.08em;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.ghost:hover{background:rgba(248,241,231,.12);color:#F8F1E7}
@media (max-width:700px){.lever{right:-58px;transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>

<div style="width: 100%; min-height: 100vh; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, rgba(248,241,231,.12), transparent 50%), linear-gradient(100deg, #7A3A40 0%, #5B0F18 45%, #3E000D 100%); display: flex; flex-direction: column; align-items: center; box-sizing: border-box; padding: 14px 16px 18px">
  <div style="width: 100%; max-width: 1240px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <span class="choed" style="font-size: 15px">DMF</span>
    <div style="display: flex; gap: 8px">
      <button class="ghost" onClick="{{replay}}">↻ REPLAY</button>
      <a class="ghost" href="Main.dc.html">SKIP INTRO →</a>
    </div>
  </div>

  <!-- compact title -->
  <header style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-top: 2px; position: relative; z-index: 3">
    <h1 class="drop" style="margin: 0; line-height: 1; display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 0 .25em; animation-delay: .3s">
      <span class="vogue" style="font-size: clamp(38px, 4.6vw, 64px); font-style: italic; font-weight: 500; letter-spacing: -.02em">Denisse's</span>
      <span class="script" style="font-size: clamp(44px, 5.2vw, 72px)">Portfolio</span>
    </h1>
    <div class="drop" style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 12px; animation-delay: .9s">
      <span style="font-size: clamp(12px, 1.2vw, 14px); opacity: .9">Founder of <strong>Work &amp; Brew</strong> · <strong>Seven Solace Co.</strong> · <strong>DensDigitalDiary Agency</strong></span>
      <span class="choed" style="font-size: 12px; padding: 5px 12px; border: 1px solid rgba(248,241,231,.4); border-radius: 999px">Product &amp; Project Manager</span>
    </div>
  </header>

  <!-- carousel -->
  <div style="position: relative; width: 100vw; max-width: 1240px; display: flex; align-items: center; justify-content: center; margin-top: 4px">
    <button class="arrow-btn side-arrow" onClick="{{prev}}" aria-label="Previous order" style="left: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
    <div class="track" onWheel="{{onWheel}}" style="{{trackStyle}}; position: relative; width: 100%; perspective: 1000px; overflow: hidden; -webkit-mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent)">
      <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(248,241,231,.35), transparent 65%); animation: glow 3s ease-in-out infinite"></span>
      <sc-for list="{{slotsCar}}" as="d" hint-placeholder-count="8">
        <button class="{{d.cls}}" onClick="{{d.pick}}" onMouseEnter="{{d.enter}}" onMouseLeave="{{leave}}" onFocus="{{d.enter}}" onBlur="{{leave}}" aria-label="{{d.label}}" tabindex="{{d.tab}}" style="{{d.style}}"><span class="cup"><img src="{{d.img}}" alt="" style="{{d.imgStyle}}"></span></button>
      </sc-for>
    </div>
    <button class="arrow-btn side-arrow" onClick="{{next}}" aria-label="Next order" style="right: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
  </div>

  <!-- cup label (compact) -->
  <div style="width: 100%; max-width: 760px; min-height: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: -6px; position: relative; z-index: 5">
    <sc-if value="{{spinning}}" hint-placeholder-val="{{ false }}">
      <span class="script" style="font-size: 40px; line-height: 1">now brewing…</span>
    </sc-if>
    <sc-for list="{{current}}" as="c" hint-placeholder-count="1">
      <div class="fade-up" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 14px">
          <span class="choed" style="font-size: 13px; padding: 5px 12px; border: 1px solid rgba(248,241,231,.45); border-radius: 999px">Order #{{c.n}} <span style="opacity: .55">/ #{{total}}</span></span>
          <span class="vogue" style="font-size: clamp(26px, 3vw, 38px); font-style: italic; line-height: 1">{{c.title}}</span>
          <a class="go-btn" href="{{c.href}}" onClick="{{c.click}}" style="padding: 11px 20px; min-height: 44px; font-size: 12px">{{c.cta}} <span class="go-arrow" aria-hidden="true">→</span></a>
        </div>
        <span style="font-size: 14px; line-height: 1.5; max-width: 560px; opacity: .85">{{c.desc}}</span>
      </div>
    </sc-for>
  </div>

  <!-- quick glance: compact chip strip -->
  <nav aria-label="Quick glance" style="width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 10px">
    <span style="font-size: 11px; letter-spacing: .2em; font-weight: 700; margin-right: 6px">QUICK GLANCE <span class="bob" aria-hidden="true" style="display: inline-block">→</span></span>
    <sc-for list="{{slots}}" as="d" hint-placeholder-count="8">
      <button class="chip-q" onClick="{{d.pick}}" aria-current="{{d.current}}" style="{{d.rowStyle}}"><span style="opacity: .6; font-weight: 700">#{{d.n}}</span> {{d.title}}</button>
    </sc-for>
  </nav>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="fade-up" style="position: fixed; bottom: 28px; left: 50%; margin-left: -210px; width: 420px; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; background: #F8F1E7; color: #3E000D; padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 60; box-shadow: 0 14px 30px rgba(0,0,0,.4)">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var DOORS = [
  { title: 'Go to website', desc: 'The full portfolio: product work, case studies and the order ticket.', href: 'Main.dc.html', img: '/_blob/3d535e2b409e0b76a7a74c905410702e', cta: 'ENTER THE WEBSITE' },
  { title: 'Work & Brew', desc: 'The café platform I founded: research, the MVP and a café-finder demo.', href: 'Main.dc.html', img: '/_blob/bce342b6abd4b2edcf1e303850ff3c25', cta: 'VISIT WORK & BREW' },
  { title: 'DensDigitalDiary Agency', desc: 'Social media, content and UGC for startups and brands.', href: 'Content.dc.html', img: '/_blob/457c7ec9afab22acce3e5a5ea79f4344', cta: 'VISIT THE AGENCY' },
  { title: 'Seven Solace Co.', desc: 'Handmade charms, from matcha chasen charms to balloon banners.', href: '#', img: '/_blob/ddd33cd3b1876572900db05153b12da1', cta: 'OPENING SOON', soon: true },
  { title: "Runner's Hub", desc: 'The tools I am building for runners: pace math, race-day splits and more.', href: 'Runners.dc.html', img: '/_blob/7cb4f72bfc2009dd917147eae0e24cbc', cta: "OPEN RUNNER'S HUB" },
  { title: 'Free Resources', desc: 'The free tools I used to build my startup, site and small business. Yours for an email.', href: 'Resources.dc.html', img: '/_blob/c5cb8d6016c0c606c99579d2490a8116', cta: 'GET THE FREE KIT' },
  { title: "Denisse's Personal Life", desc: 'Marathon miles, volunteering and daily rituals.', href: 'About.dc.html', img: '/_blob/3d535e2b409e0b76a7a74c905410702e', cta: 'SAY HI' },
  { title: 'The Kitchen', desc: 'Culinary school, corporate catering and camp kitchens.', href: 'Kitchen.dc.html', img: '/_blob/94f1e8d48308163d8fe412b89ebec9e4', cta: 'STEP INTO THE KITCHEN' }
];
function cupH() {
  if (typeof window === 'undefined') return 900;
  var w = window.innerWidth, h = window.innerHeight;
  var fit = Math.max(260, h - (w < 700 ? 360 : 330));
  return w < 700 ? Math.round(Math.min(320, w * 0.8, fit)) : Math.round(Math.min(520, fit));
}
function stepPx() { var w = (typeof window !== 'undefined') ? window.innerWidth : 1440; return Math.round(cupH() * (w < 700 ? 0.36 : 0.4)); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0, spinning: true, hover: -1, toast: '' };
  }
  componentDidMount() { var self = this; this.spin(); this.onResize = function () { self.forceUpdate(); }; window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); (this.timers || []).forEach(clearTimeout); clearTimeout(this.toastT); }
  spin() {
    var self = this, n = DOORS.length, k = n * 2, t = 0;
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ spinning: true, active: 0, hover: -1 });
    for (var j = 1; j <= k; j++) {
      t += 55 + 480 * Math.pow(j / k, 2.6);
      (function (j, t) { self.timers.push(setTimeout(function () { self.setState({ active: j % n, spinning: j < k }); }, 900 + t)); })(j, t);
    }
  }
  go(i) { var n = DOORS.length; this.setState({ active: ((i % n) + n) % n }); }
  showToast(msg) { var self = this; clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(function () { self.setState({ toast: '' }); }, 3200); }
  renderVals() {
    var self = this, s = this.state, n = DOORS.length, W = stepPx(), H = cupH();
    var slotsCar = DOORS.map(function (d, i) {
      var off = ((i - s.active) % n + n) % n; if (off > n / 2) off -= n;
      var a = Math.abs(off);
      var scale = off === 0 ? 1 : Math.max(0.56, 0.8 - (a - 1) * 0.12);
      var op = off === 0 ? 1 : a === 1 ? 0.5 : a === 2 ? 0.22 : a === 3 ? 0.08 : 0;
      var faded = !s.spinning && s.hover !== -1 && s.hover !== i;
      if (faded) op = op * 0.4;
      var blur = a * 1.2 + (faded ? 2.5 : 0);
      var dur = s.spinning ? '.16s linear' : '.65s cubic-bezier(.2,.9,.2,1)';
      return { img: d.img, imgStyle: 'height:' + H + 'px;max-width:' + Math.round(H * 0.8) + 'px', label: (off === 0 ? 'Current order #0' : 'Show order #0') + (i + 1) + ': ' + d.title,
        cls: 'slot' + (off === 0 && !s.spinning ? ' is-center' : ''), tab: a > 1 ? '-1' : '0',
        style: 'transform:translate(-50%,-50%) translateX(' + (off * W) + 'px) rotateY(' + (off * -12) + 'deg) scale(' + scale + ');opacity:' + op + ';filter:blur(' + blur + 'px)' + (faded ? ' saturate(.6)' : '') + ';z-index:' + (s.hover === i ? 20 : 10 - a) + ';transition:transform ' + dur + ',opacity ' + dur + ',filter ' + dur + ';pointer-events:' + (a > 2 ? 'none' : 'auto'),
        pick: function () { if (!self.state.spinning) self.go(i); },
        enter: function () { if (!self.state.spinning) self.setState({ hover: i }); } };
    });
    var slots = DOORS.map(function (d, i) {
      var on = i === s.active && !s.spinning;
      return { n: '0' + (i + 1), title: d.title, current: on ? 'true' : 'false',
        rowStyle: on ? 'background:#F8F1E7;color:#3E000D;border-color:#F8F1E7' : '',
        pick: function () { if (!self.state.spinning) self.go(i); } };
    });
    var d = DOORS[s.active];
    return {
      slotsCar: slotsCar, slots: slots, trackStyle: 'height:' + (H + 30) + 'px', leave: function () { self.setState({ hover: -1 }); }, total: '0' + n,
      spinning: s.spinning,
      current: s.spinning ? [] : [{ n: '0' + (s.active + 1), title: d.title, desc: d.desc, href: d.href, cta: d.cta,
        click: function (e) { if (d.soon) { e.preventDefault(); self.showToast('Seven Solace Co. is opening soon: handmade charms, coming to a shop near you.'); } } }],
      prev: function () { if (!self.state.spinning) self.go(self.state.active - 1); },
      next: function () { if (!self.state.spinning) self.go(self.state.active + 1); },
      onWheel: function (e) {
        if (self.state.spinning) return;
        var dlt = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        var now = Date.now(); if (self.lastWheel && now - self.lastWheel < 420) return;
        if (Math.abs(dlt) < 8) return;
        self.lastWheel = now; self.go(self.state.active + (dlt > 0 ? 1 : -1));
      },
      replay: function () { self.spin(); },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
